<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | truncatewords: 50 }}">
  <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  {% seo %}
  <style>
    :root {
      --text: #1a1a1a;
      --text-secondary: #555;
      --bg: #fdfdfd;
      --border: #ddd;
      --mono: "IBM Plex Mono", "Menlo", "Consolas", monospace;
      --sans: "IBM Plex Sans", "Helvetica Neue", "Arial", sans-serif;
      --max-width: 640px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.65;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    .container.wide {
      max-width: 1180px;
    }

    /* Header */
    header {
      padding: 48px 0 0;
    }

    header .site-name {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
    }

    nav {
      margin-top: 12px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    nav a {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      margin-right: 20px;
    }

    nav a:hover {
      color: var(--text);
    }

    /* Main */
    main {
      padding: 48px 0 96px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .title-logo {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .title-row h1 {
      margin-bottom: 0;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      margin-top: 40px;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 17px;
      font-weight: 600;
      margin-top: 32px;
      margin-bottom: 8px;
    }

    p {
      margin-bottom: 16px;
    }

    a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    ul, ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }

    li {
      margin-bottom: 4px;
    }

    code {
      font-family: var(--mono);
      font-size: 0.9em;
      background: #f0f0f0;
      padding: 2px 5px;
      border-radius: 3px;
    }

    .tagline {
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .lead {
      font-size: 19px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    table {
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      margin: 0 0 2rem;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      text-align: left;
      padding: 0.35rem 1rem 0.35rem 0;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.75rem;
    }
    .section-label {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 0;
      margin-bottom: 16px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 40px 0;
    }

    /* Collection */
    .counts {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .group-label {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      margin-top: 32px;
      margin-bottom: 8px;
    }

    .group-count {
      font-weight: 400;
      color: var(--text-secondary);
      text-transform: none;
    }

    .container.wide main {
      padding-top: 24px;
    }

    .container.wide .lead {
      margin-bottom: 16px;
    }

    .container.wide .counts {
      margin-bottom: 12px;
    }

    .container.wide .section-label {
      margin-bottom: 8px;
    }

    .catalogue-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 8px;
    }

    a.grid-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px;
      color: var(--text);
      text-decoration: none;
      background: color-mix(in srgb, var(--border) 12%, var(--bg));
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    a.grid-card:hover {
      border-color: var(--text);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }

    a.grid-card:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .grid-card-task {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .grid-card-title {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      margin-top: 8px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-card-desc {
      font-size: 13px;
      line-height: 1.45;
      height: calc(1.45em * 3);
      color: var(--text-secondary);
      margin-bottom: 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .grid-card-tags {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 10px;
      margin-bottom: 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid-card-tags span {
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2px 6px;
    }

    @media (max-width: 900px) {
      .catalogue-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 480px) {
      .catalogue-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      a.grid-card {
        padding: 10px;
      }
    }

    .cat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 8px;
    }

    .cat-list + .cat-list {
      margin-top: 16px;
    }

    a.cat-card {
      display: block;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 16px;
      color: var(--text);
      text-decoration: none;
    }

    a.cat-card:hover {
      border-color: var(--text);
      background: color-mix(in srgb, var(--border) 30%, transparent);
    }

    a.cat-card:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .cat-card-kind {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .cat-card-title {
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 600;
      margin-top: 6px;
      margin-bottom: 6px;
    }

    .cat-card-desc {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 0;
    }

    .cat-card-facts {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 10px;
      margin-bottom: 0;
    }

    .cat-list-nested {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0 0;
    }

    a.cat-card-mini {
      display: block;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      color: var(--text);
      text-decoration: none;
    }

    a.cat-card-mini:hover {
      border-color: var(--text);
      background: color-mix(in srgb, var(--border) 30%, transparent);
    }

    a.cat-card-mini:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .cat-card-mini .cat-card-title {
      font-size: 14px;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .cat-card-mini .cat-card-desc {
      font-size: 13px;
    }

    .attribution {
      margin: 24px 0;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .attribution-orig {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .attribution-contrib {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .attribution-license {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 0;
    }

    dl.card-fields {
      margin: 32px 0;
    }

    dl.card-fields dt {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 14px;
    }

    dl.card-fields dd {
      margin-left: 0;
      margin-bottom: 2px;
    }

    /* Footer */
    .footer-logo {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    footer {
      padding: 24px 0 48px;
      border-top: 1px solid var(--border);
    }

    footer nav {
      border: none;
      padding: 0;
      margin: 0 0 8px;
    }

    footer p {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 12px;
      margin-bottom: 0;
    }

    /* Blog list */
    .post-list {
      list-style: none;
      padding: 0;
    }

    .post-list li {
      margin-bottom: 24px;
    }

    .post-list .date {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .post-list a {
      text-decoration: none;
    }

    .post-list a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body { font-size: 16px; }
      header { padding-top: 32px; }
      main { padding: 32px 0 64px; }
      h1 { font-size: 24px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container{% if page.wide %} wide{% endif %}">
    <header></header>

    <main>
      {{ content }}
    </main>

    <footer>
      <nav>
        <a href="{{ '/about' | relative_url }}">About</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/collection/' | relative_url }}">Collection</a>
      </nav>
      <nav>
        <a href="https://github.com/idle-intelligence" target="_blank" rel="noopener">GitHub</a>
        <a href="https://huggingface.co/idle-intelligence" target="_blank" rel="noopener">HuggingFace</a>
        <a href="https://linkedin.com/company/idle-intelligence" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
      <p>&copy; {{ site.time | date: '%Y' }} Idle Intelligence</p>
    </footer>
  </div>
</body>
</html>
